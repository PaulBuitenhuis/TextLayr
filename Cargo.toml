[package]
name = "textlayr"
version = "0.2.3"
edition = "2021"
description = "Offline karaoke caption burner for short-form video"
license = "MIT"
readme = "README.md"
repository = "https://github.com/PaulBuitenhuis/TextLayr"
homepage = "https://github.com/PaulBuitenhuis/TextLayr"
authors = ["Paul Buitenhuis <7597185+PaulBuitenhuis@users.noreply.github.com>"]
keywords = ["video", "captions", "subtitles", "whisper", "ffmpeg"]
categories = ["multimedia::video", "command-line-utilities"]

[[bin]]
name = "textlayr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
dirs = "7"
sha2 = "0.11"

# Transcription (whisper.cpp bindings). CPU by default on Linux; the `metal`
# feature is enabled on macOS in the target-specific section below.
whisper-rs = "0.16"

# First-run downloads + archive extraction, pure Rust so nothing shells out to
# `curl`/`ditto`: `ureq` uses rustls (no OpenSSL), and the decoders cover the
# macOS `.zip` and Linux `.tar.xz` ffmpeg builds.
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
xz2 = "0.1"
flate2 = "1"

# Text rasterization for caption overlays.
fontdue = "0.9"
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }

# Native GUI (Milestone 3): pure-Rust egui, glow backend (Wayland/X11 via winit).
# Keep these two in lockstep: eframe re-exports its own egui, so a split bump
# puts two egui crates in the graph and every `eframe::egui` type mismatches.
eframe = "0.37"
egui = "0.37"

[profile.release]
opt-level = 3
lto = "thin"

# whisper-rs-sys generates bindgen layout tests that fail to compile against
# this glibc (the `_IO_FILE` size assertion overflows). We vendor the crate
# and disable those tests via `.layout_tests(false)`. Remove once upstream
# ships a fix.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/patch/whisper-rs-sys" }
