name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build + test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings
      # The harness end-to-end test needs a real ffmpeg; install it if the image
      # doesn't already ship one, so the export path cannot silently skip.
      - name: ensure ffmpeg (harness end-to-end test)
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      # whisper.cpp builds through cmake + clang, both present on the runner.
      - name: cargo test
        run: cargo test --locked --all-targets

  test-linux:
    name: build + test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # apt must never wait on a debconf/restart prompt in a headless runner.
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Everything apt is installed in one step: egui/eframe need the X11 and
      # Wayland headers, and the harness drives a real ffmpeg end-to-end
      # (probe → render → encode) via `--transcript`, so no whisper model is
      # needed. A second `apt-get` here once hung for 19 minutes on a prompt.
      - name: Linux dependencies (GUI headers + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev
      # Linux is the development platform, and its `cfg(target_os = "linux")`
      # branches (VAAPI, PATH lookup) are not compiled by the macOS job — so
      # clippy runs here too.
      - name: clippy
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings
      - name: cargo test
        run: cargo test --locked --all-targets
      # Build the shippable tarball so the packaging script is exercised on every
      # run and a build can be downloaded for a real-machine smoke test. CI skips
      # the AppImage (needs appimagetool); releases still produce it.
      - name: package (Linux tarball)
        env:
          TEXTLAYR_VERSION: 0.0.0-ci.${{ github.run_number }}
          SKIP_APPIMAGE: "1"
        run: scripts/package_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: textlayr-linux-x86_64
          path: dist/TextLayr-*-linux-x86_64.tar.xz
          if-no-files-found: error

  audit:
    name: cargo audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reads Cargo.lock only (no build) and fails on any RustSec advisory.
      - name: cargo audit
        run: cargo audit
