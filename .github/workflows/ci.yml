name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings
      # whisper.cpp builds through cmake + clang, both present on the runner.
      - name: cargo test
        run: cargo test --locked --all-targets

  audit:
    name: cargo audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reads Cargo.lock only (no build) and fails on any RustSec advisory.
      - name: cargo audit
        run: cargo audit
