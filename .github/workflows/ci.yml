name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build + test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings
      # The harness end-to-end test needs a real ffmpeg; install it if the image
      # doesn't already ship one, so the export path cannot silently skip.
      - name: ensure ffmpeg (harness end-to-end test)
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      # whisper.cpp builds through cmake + clang, both present on the runner.
      - name: cargo test
        run: cargo test --locked --all-targets

  test-linux:
    name: build + test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # egui/eframe link against X11/Wayland on Linux; the runner image does not
      # ship the development headers.
      - name: GUI dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev
      # Linux is the development platform, and its `cfg(target_os = "linux")`
      # branches (VAAPI, PATH lookup) are not compiled by the macOS job — so
      # clippy runs here too.
      - name: clippy
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings
      # The harness drives a real ffmpeg end-to-end (probe → render → encode)
      # via `--transcript`, which is why no whisper model is needed here.
      - name: install ffmpeg
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: cargo test
        run: cargo test --locked --all-targets
      # Build the shippable tarball so the packaging script is exercised on every
      # run and a build can be downloaded for a real-machine smoke test. CI skips
      # the AppImage (needs appimagetool); releases still produce it.
      - name: package (Linux tarball)
        env:
          TEXTLAYR_VERSION: 0.0.0-ci.${{ github.run_number }}
          SKIP_APPIMAGE: "1"
        run: scripts/package_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: textlayr-linux-x86_64
          path: dist/TextLayr-*-linux-x86_64.tar.xz
          if-no-files-found: error

  audit:
    name: cargo audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reads Cargo.lock only (no build) and fails on any RustSec advisory.
      - name: cargo audit
        run: cargo audit
