name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Published macOS artifact. This is the release gate: it must always succeed.
  build-macos:
    name: build (macos-arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` feeds the build stamp
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Derive version from the tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package (macOS)
        env:
          TEXTLAYR_VERSION: ${{ steps.version.outputs.value }}
        run: scripts/package_macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  # Linux is built by CI on every push, but is not published yet: the desktop
  # GUI and the bundled whisper build still need a real Linux pass. Set the
  # repository variable TEXTLAYR_RELEASE_LINUX=true to publish it again; the
  # publish job includes the artifacts automatically when they exist.
  build-linux:
    name: build (linux-x86_64)
    if: vars.TEXTLAYR_RELEASE_LINUX == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` feeds the build stamp
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux GUI dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev

      - name: Install appimagetool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/bin/appimagetool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Derive version from the tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        env:
          TEXTLAYR_VERSION: ${{ steps.version.outputs.value }}
        run: scripts/package_linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-x86_64
          path: |
            dist/*.tar.xz
            dist/*.AppImage
          if-no-files-found: error

  # Single publish job: gather whichever platform artifacts exist, write
  # SHA256SUMS and latest.json, then attach them to one GitHub Release. The
  # manifest only lists Linux when its tarball is present, so a macOS-only
  # release cannot advertise an asset that was never built.
  publish:
    name: publish release
    needs: [build-macos, build-linux]
    if: >-
      always() &&
      needs.build-macos.result == 'success' &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Derive version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Checksums + update manifest
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          V="$VERSION"

          mac_zip="TextLayr-${V}.zip"
          mac_dmg="TextLayr-${V}.dmg"
          lin_tar="TextLayr-${V}-linux-x86_64.tar.xz"
          lin_app="TextLayr-${V}-linux-x86_64.AppImage"

          for f in "$mac_zip" "$mac_dmg"; do
            [ -f "$f" ] || { echo "missing release artifact: $f" >&2; exit 1; }
          done

          sha()   { sha256sum "$1" | awk '{print $1}'; }
          size()  { stat -c%s "$1"; }
          asset() { printf '{"name":"%s","sha256":"%s","size":%s}' "$1" "$(sha "$1")" "$(size "$1")"; }

          # macOS is mandatory; Linux is included only when CI built it.
          sha_files=("$mac_zip" "$mac_dmg")
          platforms="\"macos-arm64\": { \"zip\": $(asset "$mac_zip"), \"dmg\": $(asset "$mac_dmg") }"
          if [ -f "$lin_tar" ]; then
            lin_assets="\"tar\": $(asset "$lin_tar")"
            if [ -f "$lin_app" ]; then
              lin_assets="${lin_assets}, \"appimage\": $(asset "$lin_app")"
              sha_files+=("$lin_app")
            fi
            # The AppImage is best-effort (needs appimagetool); the .tar.xz is
            # the fallback.
            platforms="${platforms}, \"linux-x86_64\": { ${lin_assets} }"
            sha_files+=("$lin_tar")
          else
            echo "no Linux artifacts; publishing the macOS release only" >&2
          fi

          sha256sum "${sha_files[@]}" > SHA256SUMS

          # `zip`/`dmg` at the top level stay for backward compatibility; the app
          # reads `platforms{}` (keyed by platform::slug()).
          cat > latest.json <<EOF
          {
            "version": "${V}",
            "notes_url": "https://github.com/PaulBuitenhuis/TextLayr/releases/tag/v${V}",
            "zip": $(asset "$mac_zip"),
            "dmg": $(asset "$mac_dmg"),
            "platforms": { ${platforms} }
          }
          EOF

          python3 -c "import json; json.load(open('latest.json')); print('latest.json is valid JSON')"

          # Version-agnostic aliases for the website (after SHA256SUMS, so the
          # checksums only name the versioned files).
          cp "$mac_dmg" TextLayr.dmg
          cp "$mac_zip" TextLayr.zip

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/TextLayr-*.dmg
            dist/TextLayr-*.zip
            dist/TextLayr-*.tar.xz
            dist/TextLayr-*.AppImage
            dist/TextLayr.dmg
            dist/TextLayr.zip
            dist/SHA256SUMS
            dist/latest.json
