name: Release

on:
  push:
    tags: ["v*"]
  # Rehearsal: build the same artefacts a tag would, upload them for a
  # real-machine test, and stop before publishing. The version is compiled in,
  # so pass the version the release will carry. Publishing still needs a tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v), e.g. 0.4.0"
        required: true
        default: "0.4.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Published macOS artifact. This is the release gate: it must always succeed.
  build-macos:
    name: build (macos-arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` feeds the build stamp
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Derive version from the tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "value=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (macOS)
        env:
          TEXTLAYR_VERSION: ${{ steps.version.outputs.value }}
        run: scripts/package_macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-arm64
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  # Linux is built by CI on every push, but is not published yet: the desktop
  # GUI and the bundled whisper build still need a real Linux pass. Set the
  # repository variable TEXTLAYR_RELEASE_LINUX=true to publish it; the publish
  # job includes the artifacts automatically when they exist. A manual dispatch
  # is a rehearsal and builds Linux even while the variable is unset.
  build-linux:
    name: build (linux-x86_64)
    if: vars.TEXTLAYR_RELEASE_LINUX == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      # No `-march=native` in the shipped binary; see scripts/package_linux.sh.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` feeds the build stamp
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux GUI dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev \
            libfontconfig1-dev

      - name: Install appimagetool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/bin/appimagetool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Derive version from the tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "value=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Linux)
        env:
          TEXTLAYR_VERSION: ${{ steps.version.outputs.value }}
        run: scripts/package_linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-x86_64
          path: |
            dist/*.tar.xz
            dist/*.AppImage
          if-no-files-found: error

  # Single publish job: gather whichever platform artifacts exist, write
  # SHA256SUMS and latest.json, then attach them to one GitHub Release. The
  # manifest only lists Linux when its tarball is present, so a macOS-only
  # release cannot advertise an asset that was never built.
  publish:
    name: publish release
    needs: [build-macos, build-linux]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.build-macos.result == 'success' &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Derive version from the tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "value=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checksums + update manifest
        run: scripts/release_manifest.sh dist "${{ steps.version.outputs.value }}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/TextLayr-*.dmg
            dist/TextLayr-*.zip
            dist/TextLayr-*.tar.xz
            dist/TextLayr-*.AppImage
            dist/TextLayr.dmg
            dist/TextLayr.zip
            dist/TextLayr-linux-x86_64.tar.xz
            dist/TextLayr-linux-x86_64.AppImage
            dist/SHA256SUMS
            dist/latest.json
